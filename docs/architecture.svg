<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#374151"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d03030"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3fd1"/></marker>
    <style>
      .t  { font-size: 14.5px; font-weight: 700; }
      .b  { font-size: 12px; fill: #374151; }
      .s  { font-size: 11.5px; fill: #374151; }
      .tl { font-size: 12px; font-weight: 700; }
      .lbl { font-size: 11.5px; font-weight: 700; fill: #374151; }
      .fail { font-size: 11.5px; font-weight: 700; fill: #d03030; }
      .pass { font-size: 11.5px; font-weight: 700; fill: #1f7a3a; }
      .flow { fill: none; stroke: #374151; stroke-width: 1.8; marker-end: url(#a); }
      .loop { fill: none; stroke: #d03030; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#r); }
      .mem  { fill: none; stroke: #7c3fd1; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#p); }
      .blue   { fill: #e8f0fd; stroke: #2f5fb3; stroke-width: 1.6; }
      .critic { fill: #fff4e0; stroke: #d4892a; stroke-width: 1.6; }
      .router { fill: #f1e9fb; stroke: #7c3fd1; stroke-width: 1.6; }
      .teal   { fill: #e0f5f2; stroke: #1f7a6d; stroke-width: 1.6; }
      .green  { fill: #e6f5ea; stroke: #2e8b4a; stroke-width: 1.6; }
      .grey   { fill: #f2f3f5; stroke: #6b7280; stroke-width: 1.6; }
      .rose   { fill: #fdeef3; stroke: #c2417a; stroke-width: 1.6; }
      .purple { fill: #f3ecfc; stroke: #7c3fd1; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1240" height="1060" fill="#ffffff"/>
  <text x="34" y="32" font-size="21" font-weight="700" fill="#111827">Multi-Agent SOC Alert Triage and Incident Response Assistant: Architecture</text>

  <!-- inputs and the local LLM (outside the graph) -->
  <rect class="grey" x="34" y="46" width="380" height="62" rx="8"/>
  <text class="t" x="50" y="68" fill="#111827">Alert sources</text>
  <text class="b" x="50" y="86">Synthetic SIEM (auth, firewall, EDR, DNS),</text>
  <text class="b" x="50" y="100">Windows Security / Sysmon, JSON upload, live feed</text>

  <rect class="grey" x="820" y="46" width="380" height="62" rx="8" stroke-dasharray="5 3"/>
  <text class="t" x="836" y="68" fill="#111827">Local LLM: Ollama (llama3.2, 3B)</text>
  <text class="b" x="836" y="86">Plans Research tool calls; writes summaries, report,</text>
  <text class="b" x="836" y="100">handover and chat answers. Never scores or decides.</text>

  <!-- orchestration layer -->
  <rect x="18" y="122" width="1204" height="763" rx="14" fill="#fbf9ff" stroke="#7c3fd1" stroke-width="2.2" stroke-dasharray="8 5"/>
  <text x="36" y="146" font-size="13.5" font-weight="700" fill="#6b2fc0">ORCHESTRATION LAYER · LangGraph state graph</text>

  <text x="700" y="160" font-size="13" font-weight="700" fill="#6b2fc0">The orchestrator decides</text>
  <text class="b" x="700" y="178">• which agent runs next (task order)</text>
  <text class="b" x="700" y="193">• where each incident goes (severity routing)</text>
  <text class="b" x="700" y="208">• when the Critic sends work back (max 2 retries, then a person)</text>
  <text class="b" x="700" y="223">• when to pause for the analyst (LangGraph interrupt)</text>

  <!-- 1 Planner -->
  <path class="flow" d="M414 77 H490 V158"/>
  <rect class="blue" x="345" y="160" width="290" height="66" rx="8"/>
  <text class="t" x="361" y="183" fill="#1e3a8a">1. Planner Agent</text>
  <text class="b" x="361" y="201">Groups alerts by host and 30-minute window;</text>
  <text class="b" x="361" y="216">builds a task plan per candidate incident</text>

  <path class="flow" d="M490 226 V244 H189 V266"/>
  <text class="s" x="200" y="239">task plan</text>

  <!-- 2 Research -->
  <rect class="blue" x="34" y="268" width="310" height="140" rx="8"/>
  <text class="t" x="50" y="291" fill="#1e3a8a">2. Research Agent</text>
  <text class="b" x="50" y="311">LLM plans which tools to call for each</text>
  <text class="b" x="50" y="326">suspicious candidate; plan validated against</text>
  <text class="b" x="50" y="341">its own entities. Quiet ones: fixed checklist.</text>
  <text class="tl" x="50" y="361" fill="#1e3a8a">Tools:</text>
  <text class="b" x="50" y="376">Threat intel (IP / domain / hash), assets,</text>
  <text class="b" x="50" y="391">user baseline, estate hunt, analyst memory</text>

  <path class="flow" d="M344 338 H403"/>
  <text class="s" x="349" y="329">evidence</text>

  <!-- 3 Executor -->
  <rect class="blue" x="405" y="268" width="305" height="140" rx="8"/>
  <text class="t" x="421" y="291" fill="#1e3a8a">3. Executor Agent</text>
  <text class="b" x="421" y="311">Links candidates across hosts (lateral</text>
  <text class="b" x="421" y="326">movement), correlates kill-chain stages,</text>
  <text class="b" x="421" y="341">scores severity 0-100 with the rubric</text>
  <text class="tl" x="421" y="361" fill="#1e3a8a">Tools:</text>
  <text class="b" x="421" y="376">Correlation engine + cross-host linker,</text>
  <text class="b" x="421" y="391">rubric scorer, LLM summary (fact-checked)</text>

  <path class="flow" d="M710 338 H746"/>

  <!-- 4 Critic CP1 -->
  <polygon class="critic" points="878,266 1008,338 878,410 748,338"/>
  <text class="t" x="878" y="318" text-anchor="middle" fill="#9a4d00">4. Critic Agent</text>
  <text class="tl" x="878" y="333" text-anchor="middle" fill="#9a4d00">Checkpoint 1</text>
  <text class="s" x="878" y="351" text-anchor="middle">All lookups done?</text>
  <text class="s" x="878" y="365" text-anchor="middle">Evidence cited?</text>
  <text class="s" x="878" y="379" text-anchor="middle">Score recomputed?</text>

  <path class="loop" d="M878 266 V252 H557 V266"/>
  <text class="fail" x="575" y="246">FAIL: bad evidence / score mismatch → Executor</text>

  <path class="loop" d="M815 375 V440 H189 V410"/>
  <text class="fail" x="420" y="456">FAIL: missing lookups → Research (max 2 retries each)</text>

  <path class="flow" d="M878 410 V453"/>
  <text class="pass" x="888" y="436">PASS</text>

  <!-- severity router -->
  <polygon class="router" points="878,455 988,505 878,555 768,505"/>
  <text x="878" y="501" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2fc0">Severity</text>
  <text x="878" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#6b2fc0">router</text>

  <path class="flow" d="M768 505 H160 V623"/>
  <path class="flow" d="M447 505 V623"/>
  <text class="lbl" x="170" y="570">Low (&lt; 40)</text>
  <text class="lbl" x="457" y="570">Medium (40-69)</text>
  <path class="flow" d="M878 555 V578 H676 V623"/>
  <text class="lbl" x="888" y="572">High / Critical (70+)</text>

  <!-- row 3 -->
  <rect class="grey" x="34" y="625" width="250" height="76" rx="8"/>
  <text class="t" x="50" y="648" fill="#111827">Auto-close</text>
  <text class="b" x="50" y="668">Logs a justification note citing the</text>
  <text class="b" x="50" y="683">benign explanation; no analyst time.</text>

  <rect class="grey" x="320" y="625" width="255" height="76" rx="8"/>
  <text class="t" x="336" y="648" fill="#111827">Analyst queue</text>
  <text class="b" x="336" y="668">Ticket with evidence and a short</text>
  <text class="b" x="336" y="683">recommended investigation checklist.</text>

  <rect class="teal" x="607" y="625" width="285" height="118" rx="8"/>
  <text class="t" x="623" y="648" fill="#115e54">5. Software Development Agent</text>
  <text class="b" x="623" y="668">Writes IR playbook + detection rule + unit</text>
  <text class="b" x="623" y="683">test; exports the rule as Sigma.</text>
  <text class="tl" x="623" y="703" fill="#115e54">Tools:</text>
  <text class="b" x="623" y="718">Rule tester (attack + benign logs),</text>
  <text class="b" x="623" y="733">pySigma → Splunk / Elastic queries</text>

  <path class="flow" d="M892 677 H926"/>

  <rect class="critic" x="928" y="625" width="270" height="104" rx="8"/>
  <text class="t" x="944" y="648" fill="#9a4d00">4. Critic Agent: Checkpoint 2</text>
  <text class="b" x="944" y="668">Rule fires on attack, silent on benign.</text>
  <text class="b" x="944" y="683">Playbook order safe: preserve evidence</text>
  <text class="b" x="944" y="698">before isolating the host.</text>

  <path class="loop" d="M1063 625 V603 H780 V623"/>
  <text class="fail" x="905" y="598">FAIL: revise rule / playbook</text>

  <path class="flow" d="M1063 729 V763"/>
  <text class="pass" x="1073" y="751">PASS</text>

  <!-- row 4 -->
  <rect x="34" y="765" width="262" height="100" rx="8" fill="#fff9ef" stroke="#d4892a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text class="t" x="50" y="788" fill="#9a4d00">Critic fact-check (LLM prose)</text>
  <text class="b" x="50" y="808">Every ID, IP, host, hash, domain and</text>
  <text class="b" x="50" y="823">number must appear in the facts, else</text>
  <text class="b" x="50" y="838">rewrite (max 2), then factual template.</text>
  <text class="s" x="50" y="854" font-style="italic">Summaries, report, handover, chat answers</text>

  <path class="flow" d="M160 701 V740 H397 V763"/>
  <path class="flow" d="M447 701 V763"/>

  <rect class="green" x="320" y="765" width="470" height="104" rx="8"/>
  <text class="t" x="336" y="788" fill="#14532d">6. Business Automation Agent</text>
  <text class="b" x="336" y="808">Creates tickets, sets SLA timers, assigns the on-call analyst, sends</text>
  <text class="b" x="336" y="823">mock alerts, writes the incident report + shift handover.</text>
  <text class="tl" x="336" y="843" fill="#14532d">Tools:</text>
  <text class="b" x="336" y="858">Mock ticketing, mock notifier, PDF report (LLM prose, fact-checked)</text>

  <rect class="rose" x="928" y="765" width="270" height="92" rx="8"/>
  <text class="t" x="944" y="788" fill="#9d174d">Analyst approval</text>
  <text class="tl" x="944" y="805" fill="#9d174d">LangGraph interrupt: the run pauses</text>
  <text class="b" x="944" y="824">Approve containment, hold, or mark</text>
  <text class="b" x="944" y="839">false positive (both update memory).</text>

  <path class="flow" d="M928 811 H792"/>
  <text class="s" x="822" y="804">decision</text>

  <!-- outside the graph: state, console, memory -->
  <path class="flow" d="M555 869 V903"/>
  <path class="mem" d="M1063 857 V903"/>
  <text class="s" x="1073" y="876" fill="#6b2fc0">learn</text>

  <rect class="purple" x="34" y="905" width="262" height="100" rx="8"/>
  <text class="t" x="50" y="928" fill="#6b2fc0">Shared workflow state</text>
  <text class="b" x="50" y="947">alerts, task_plan, enriched_context,</text>
  <text class="b" x="50" y="962">incidents, severity, critic_verdicts,</text>
  <text class="b" x="50" y="977">prose_checks, playbook, approvals, ...</text>
  <text class="tl" x="50" y="995" fill="#6b2fc0">Every agent reads and writes it</text>

  <rect class="grey" x="320" y="905" width="470" height="100" rx="8"/>
  <text class="t" x="336" y="928" fill="#111827">Web analyst console (FastAPI + HTML/JS)</text>
  <text class="b" x="336" y="947">Live graph + agent trace, incidents, ATT&amp;CK grid, playbook, rule,</text>
  <text class="b" x="336" y="962">Sigma / Splunk / Elastic, memory, benchmark, Ask-the-run chat</text>
  <text class="b" x="336" y="977">Exports: PDF report + handover, tickets JSON, Sigma YAML</text>
  <text class="s" x="336" y="995" font-style="italic">Analyst approval and feedback buttons feed back into the run</text>

  <rect class="purple" x="928" y="905" width="270" height="100" rx="8"/>
  <text class="t" x="944" y="928" fill="#6b2fc0">Analyst memory (persistent)</text>
  <text class="b" x="944" y="947">Approve: block-list the indicators</text>
  <text class="b" x="944" y="962">False positive: allow-list indicators,</text>
  <text class="b" x="944" y="977">widen the user's baseline</text>
  <text class="tl" x="944" y="995" fill="#6b2fc0">Read by Research on the next run</text>

  <!-- legend -->
  <path class="flow" d="M34 1035 H74"/>
  <text class="b" x="84" y="1039">Data flow</text>
  <path class="loop" d="M174 1035 H214"/>
  <text class="b" x="224" y="1039">Critic feedback loop</text>
  <path class="mem" d="M374 1035 H414"/>
  <text class="b" x="424" y="1039">Memory update</text>
  <rect x="534" y="1027" width="40" height="16" rx="3" fill="#f2f3f5" stroke="#6b7280" stroke-dasharray="5 3"/>
  <text class="b" x="584" y="1039">Local LLM: outside the graph, called by agents</text>
</svg>
